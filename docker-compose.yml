services:
  # ============================================================
  # Neo4j Knowledge Graph Database
  # ============================================================
  neo4j:
    image: neo4j:5.15-community
    container_name: agentic-neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Telekom Minister Agent (Port 8001)
  # ============================================================
  telekom-minister:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-telekom-minister
    command: python src/agents/telekom_minister/main.py
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # URLs for delegation to other agents
      - SIEMENS_TECHNICIAN_URL=http://siemens-technician:8002
      - ILLIGO_OPERATOR_URL=http://illigo-operator:8003
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Siemens Technician Agent (Port 8002)
  # ============================================================
  siemens-technician:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-siemens-technician
    command: python src/agents/siemens_technician/main.py
    ports:
      - "8002:8002"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Illigo Operator Agent (Port 8003)
  # ============================================================
  illigo-operator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-illigo-operator
    command: python src/agents/illigo_operator/main.py
    ports:
      - "8003:8003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Streamlit UI (Port 8501)
  # ============================================================
  streamlit-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-streamlit-ui
    command: python -m streamlit run src/ui/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Agent URLs for inter-container communication
      - TELEKOM_MINISTER_URL=http://telekom-minister:8001
      - SIEMENS_TECHNICIAN_URL=http://siemens-technician:8002
      - ILLIGO_OPERATOR_URL=http://illigo-operator:8003
    depends_on:
      - telekom-minister
      - siemens-technician
      - illigo-operator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  neo4j_data:
  neo4j_logs:
