services:
  # ============================================================
  # Neo4j Knowledge Graph Database
  # ============================================================
  neo4j:
    image: neo4j:5.15-community
    container_name: agentic-neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 1g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Governance Agent (Port 8001) - Workflow & Context (The Anthropologist)
  # ============================================================
  governance-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-governance-agent
    command: python src/agents/governance_agent/main.py
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - AZURE_DEPLOYMENT_GPT=${AZURE_DEPLOYMENT_GPT}
      - AZURE_DEPLOYMENT_HAIKU=${AZURE_DEPLOYMENT_HAIKU}
      - AZURE_DEPLOYMENT_SONNET=${AZURE_DEPLOYMENT_SONNET}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # URLs for delegation to other agents
      - SIEMENS_TECHNICIAN_URL=http://hardware-agent:8002
      - ILLIGO_OPERATOR_URL=http://telemetry-agent:8003
      - HARDWARE_AGENT_URL=http://hardware-agent:8002
      - TELEMETRY_AGENT_URL=http://telemetry-agent:8003
      # Data paths
      - GOVERNANCE_DATA_DIR=data/processed/governance
      - PROCESSED_BASE_DIR=data/processed
      - RAW_DATA_DIR=data/raw/siemens
    volumes:
      - ./data:/app/data:z
      - ./config:/app/config:z
      - ./chroma_db:/app/chroma_db:z
      - ./logs:/app/logs:z
      - ./results:/app/results:z
    mem_limit: 1500m
    mem_reservation: 768m
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================================
  # Hardware Agent (Port 8002) - Diagnostic & Technical (The Specialist)
  # ============================================================
  hardware-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-hardware-agent
    command: python src/agents/hardware_agent/main.py
    ports:
      - "8002:8002"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - AZURE_DEPLOYMENT_GPT=${AZURE_DEPLOYMENT_GPT}
      - AZURE_DEPLOYMENT_HAIKU=${AZURE_DEPLOYMENT_HAIKU}
      - AZURE_DEPLOYMENT_SONNET=${AZURE_DEPLOYMENT_SONNET}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Data paths
      - HARDWARE_DATA_DIR=data/processed/hardware
      - RAW_PDF_DIR=data/raw/siemens
      - PARQUET_DATA_DIR=data/raw/siemens/eventlog_txt
    volumes:
      - ./data:/app/data:z
      - ./config:/app/config:z
      - ./chroma_db:/app/chroma_db:z
    mem_limit: 2g
    mem_reservation: 1g
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================================
  # Telemetry Agent (Port 8003) - Safety & Compliance (The Auditor)
  # ============================================================
  telemetry-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-telemetry-agent
    command: python src/agents/telemetry_agent/main.py
    ports:
      - "8003:8003"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - AZURE_DEPLOYMENT_GPT=${AZURE_DEPLOYMENT_GPT}
      - AZURE_DEPLOYMENT_HAIKU=${AZURE_DEPLOYMENT_HAIKU}
      - AZURE_DEPLOYMENT_SONNET=${AZURE_DEPLOYMENT_SONNET}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Data paths
      - TELEMETRY_DATA_DIR=data/processed/telemetry
      - RAW_PDF_DIR=data/raw/siemens
    volumes:
      - ./data:/app/data:z
      - ./config:/app/config:z
      - ./chroma_db:/app/chroma_db:z
    mem_limit: 1500m
    mem_reservation: 768m
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================================
  # React Frontend (Port 3000)
  # ============================================================
  frontend:
    build: ./frontend
    container_name: agentic-frontend
    ports:
      - "3000:3000"
    command: node ./node_modules/vite/bin/vite.js --host 0.0.0.0 --port 3000
    environment:
      - VITE_GOV_HOST=governance-agent
      - VITE_HW_HOST=hardware-agent
      - VITE_TEL_HOST=telemetry-agent
    depends_on:
      - governance-agent
      - hardware-agent
      - telemetry-agent

volumes:
  neo4j_data:
  neo4j_logs:
