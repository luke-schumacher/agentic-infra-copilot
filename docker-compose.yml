services:
  # ============================================================
  # Neo4j Knowledge Graph Database
  # ============================================================
  neo4j:
    image: neo4j:5.15-community
    container_name: agentic-neo4j
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Governance Agent (Port 8001) - Clinical Governance / SLA Authority
  # ============================================================
  governance-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-governance-agent
    command: python src/agents/governance_agent/main.py
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # URLs for delegation to other agents (Healthcare MAS)
      - SIEMENS_TECHNICIAN_URL=http://hardware-agent:8002
      - ILLIGO_OPERATOR_URL=http://telemetry-agent:8003
      - HARDWARE_AGENT_URL=http://hardware-agent:8002
      - TELEMETRY_AGENT_URL=http://telemetry-agent:8003
      # Data paths for Healthcare MAS
      - GOVERNANCE_DATA_DIR=data/processed/governance
      - RAW_TEMPLATES_DIR=data/raw/siemens/examination/RSNA-RAD-REPORT
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./chroma_db:/app/chroma_db
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Hardware Agent (Port 8002) - MRI Equipment & Specifications
  # ============================================================
  hardware-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-hardware-agent
    command: python src/agents/hardware_agent/main.py
    ports:
      - "8002:8002"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Data paths for Healthcare MAS
      - HARDWARE_DATA_DIR=data/processed/hardware
      - RAW_PDF_DIR=data/raw/siemens
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./chroma_db:/app/chroma_db
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Telemetry Agent (Port 8003) - MRI Event Log Analysis
  # ============================================================
  telemetry-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-telemetry-agent
    command: python src/agents/telemetry_agent/main.py
    ports:
      - "8003:8003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Data paths for Healthcare MAS
      - TELEMETRY_DATA_DIR=data/processed/telemetry
      - RAW_LOGS_DIR=data/raw/siemens/eventlog_txt
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./chroma_db:/app/chroma_db
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Streamlit UI (Port 8501)
  # ============================================================
  streamlit-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-streamlit-ui
    command: python -m streamlit run src/ui/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Agent URLs for inter-container communication
      - TELEKOM_MINISTER_URL=http://governance-agent:8001
      - SIEMENS_TECHNICIAN_URL=http://hardware-agent:8002
      - ILLIGO_OPERATOR_URL=http://telemetry-agent:8003
    depends_on:
      - governance-agent
      - hardware-agent
      - telemetry-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  neo4j_data:
  neo4j_logs:
